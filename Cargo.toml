[package]
name = "myai"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
ai = { path = "ai/src/rs/ai" }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3
