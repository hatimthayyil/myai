[workspace]
members = ["ai/src/rs/*"]
default-members = [".", "ai/src/rs/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
ai = { path = "ai/src/rs/ai" }
ai-memory = { path = "ai/src/rs/memory" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
gix = { version = "0.88.0", default-features = false, features = ["anyhow", "sha1"] }
jiff = "0.2.37"
regex = "1.13.1"
sha2 = "0.11.0"
tempfile = "3.27.0"

[package]
name = "myai"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
ai.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.dev.package."*"]
opt-level = 3
