[package]
name = "ai-memory"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
gix = { version = "0.88.0", default-features = false, features = ["anyhow", "sha1"] }
jiff = "0.2.37"
memchr = "2.8.3"
libc = "0.2.190"
regex = "1.13.1"
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3
