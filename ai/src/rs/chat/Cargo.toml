[package]
name = "ai-chat"
version = "0.3.0"
edition = "2024"

[dependencies]
ai-memory = { path = "../memory" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
jiff = "0.2.37"
serde_json = "1.0.151"
signal-hook = "0.4.5"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3
